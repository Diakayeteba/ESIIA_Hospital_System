{% extends "base.html" %}
{% block title %}Supprimer — EHS{% endblock %}
{% block content %}
<div class="card">
  <h1>Supprimer le compte</h1>
  <p>Confirmer la suppression de <strong>{{ staff_user.get_username }}</strong> ?</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button type="submit" class="btn btn--danger">Supprimer</button>
      <a class="btn btn--secondary" href="{% url 'staff:list' %}">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
